name: contract

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and property tests
        run: |
          set -o pipefail
          cargo test -p circuit --lib 2>&1 | tee cargo.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Summary
        if: always()
        run: bash .github/scripts/summary.sh cargo.log

  wasm-and-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        working-directory: contracts/circuit
        run: |
          set -o pipefail
          cargo near build non-reproducible-wasm 2>&1 | tee ../../cargo.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Summary
        if: always()
        run: bash .github/scripts/summary.sh cargo.log
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-wasm
          path: target/near/circuit/*.wasm
      - name: Sandbox integration, adversarial and concurrency tests
        run: |
          set -o pipefail
          export CIRCUIT_WASM=$PWD/target/near/circuit/circuit.wasm
          cargo test -p circuit-sandbox-tests -- --test-threads=2 --nocapture 2>&1 | tee cargo.log
      - name: Annotate sandbox failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Sandbox summary
        if: always()
        run: |
          bash .github/scripts/summary.sh cargo.log
          if [ -f target/bench/concurrency-sandbox.json ]; then
            echo "::notice title=concurrency experiment::$(tr -d '\n' < target/bench/concurrency-sandbox.json | tr -s ' ')"
          fi
          grep -E "gas burnt|total cost" cargo.log | sed 's/^/::notice title=gas::/' || true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build TypeScript packages
        run: pnpm install --frozen-lockfile && pnpm -r build && pnpm -r test
      - name: Agent simulator against a local sandbox node
        working-directory: packages/agent-simulator
        run: |
          node dist/cli.js all --network sandbox --wasm $GITHUB_WORKSPACE/target/near/circuit/circuit.wasm
          # Dress rehearsal of the exact testnet configuration (amounts scaled to 0.1).
          node dist/cli.js all --network sandbox --scale 0.1 --wasm $GITHUB_WORKSPACE/target/near/circuit/circuit.wasm --out reports/scaled
      - name: Simulator summary
        if: always()
        run: |
          node .github/scripts/sim-summary.mjs
          node .github/scripts/sim-summary.mjs packages/agent-simulator/reports/scaled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-reports
          path: packages/agent-simulator/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: target/bench/
          if-no-files-found: ignore
