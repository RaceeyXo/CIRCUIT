name: contract

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and property tests
        run: |
          set -o pipefail
          cargo test -p circuit --lib 2>&1 | tee cargo.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Summary
        if: always()
        run: bash .github/scripts/summary.sh cargo.log

  wasm-and-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        working-directory: contracts/circuit
        run: |
          set -o pipefail
          cargo near build non-reproducible-wasm 2>&1 | tee ../../cargo.log
      - name: Annotate failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Summary
        if: always()
        run: bash .github/scripts/summary.sh cargo.log
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-wasm
          path: target/near/circuit/*.wasm
      - name: Sandbox integration, adversarial and concurrency tests
        run: |
          set -o pipefail
          export CIRCUIT_WASM=$PWD/target/near/circuit/circuit.wasm
          cargo test -p circuit-sandbox-tests -- --test-threads=2 --nocapture 2>&1 | tee cargo.log
      - name: Annotate sandbox failures
        if: failure()
        run: python3 .github/scripts/annotate.py cargo.log
      - name: Sandbox summary
        if: always()
        run: |
          bash .github/scripts/summary.sh cargo.log
          if [ -f target/bench/concurrency-sandbox.json ]; then
            echo "::notice title=concurrency experiment::$(tr -d '\n' < target/bench/concurrency-sandbox.json | tr -s ' ')"
          fi
          grep -E "gas burnt|total cost" cargo.log | sed 's/^/::notice title=gas::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: target/bench/
          if-no-files-found: ignore
