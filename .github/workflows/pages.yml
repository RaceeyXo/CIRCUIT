name: site

# Builds the site (landing page + read-only console, Next.js static export) and publishes it to
# GitHub Pages. Requires Settings → Pages → Source = "GitHub Actions".
# Runs on pushes to main that touch the site or the evidence, or manually (Actions → site).
# The console defaults to the testnet concurrency contract; override with the repository variable
# CIRCUIT_CONTRACT_ID (and optionally CIRCUIT_NETWORK).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "evidence/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Fails fast with a clear message if Pages isn't enabled with Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter @circuit/shared build
      - name: Build site (Next.js static export)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_NETWORK: ${{ vars.CIRCUIT_NETWORK || 'testnet' }}
          NEXT_PUBLIC_CONTRACT_ID: ${{ vars.CIRCUIT_CONTRACT_ID || 'circuitmwdgosbr12.circuit-demo.testnet' }}
        run: |
          mkdir -p public/evidence
          if ls ../../evidence/testnet/*.json >/dev/null 2>&1; then
            cp ../../evidence/testnet/*.json public/evidence/
            export NEXT_PUBLIC_REPORTS=$(cd public && ls evidence/*.json | paste -sd, -)
          fi
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4
