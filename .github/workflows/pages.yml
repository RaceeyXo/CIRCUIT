name: dashboard

# Builds the read-only dashboard and publishes it to GitHub Pages.
# Manual only: Actions → dashboard → Run workflow. Requires Pages source = "GitHub Actions".
# Set repository variables CIRCUIT_CONTRACT_ID (and optionally CIRCUIT_NETWORK) to choose the default contract.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter @circuit/shared build
      - name: Build dashboard
        working-directory: apps/web
        env:
          VITE_NETWORK: ${{ vars.CIRCUIT_NETWORK || 'testnet' }}
          VITE_CONTRACT_ID: ${{ vars.CIRCUIT_CONTRACT_ID }}
        run: |
          mkdir -p public/evidence
          if ls ../../evidence/testnet/*.json >/dev/null 2>&1; then
            cp ../../evidence/testnet/*.json public/evidence/
            export VITE_REPORTS=$(cd public && ls evidence/*.json | paste -sd, -)
          fi
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
