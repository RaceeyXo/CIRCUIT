[package]
name = "circuit-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration and adversarial tests for the CIRCUIT contract on a local NEAR sandbox (Linux only)."

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
